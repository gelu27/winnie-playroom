<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F0E6">
<title>Winnie Tai 遊戲室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：一次一個全螢幕畫面；米色木頭教室，低飽和、無閃爍。右上小太陽顯示剩餘時間。 */
:root {
  --bg: #F5F0E6;
  --panel: #EDE5D6;
  --ink: #4A4237;
  --soft: #8A7E6C;
  --wood: #B08A5A;
  --water: #A9C3CF;
  --land: #C7BE95;
  --sky: #D3DEE3;
  --sun: #E8B86A;
  --ok: #8FAE8B;
  --font: "Huninn", "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
  --cloud: color-mix(in srgb, #fff 60%, var(--bg));
  --tint-amt: 62%;
  --lift: 0 2px 0 color-mix(in srgb, var(--ink) 7%, transparent), 0 8px 18px -8px color-mix(in srgb, var(--ink) 22%, transparent);
  --sink: inset 0 2px 7px color-mix(in srgb, var(--ink) 9%, transparent);
  color-scheme: light;
}
:root.night {
  --bg: #3A342C;
  --panel: #463F35;
  --ink: #E6DCC8;
  --soft: #B3A68F;
  --wood: #9C7A50;
  --water: #5D7480;
  --land: #75704F;
  --sky: #5A656B;
  --sun: #C99A55;
  --ok: #6F8C6B;
  --cloud: color-mix(in srgb, var(--ink) 10%, var(--bg));
  --tint-amt: 16%;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body {
  background: radial-gradient(130% 90% at 50% -20%, color-mix(in srgb, var(--sun) 13%, var(--bg)), var(--bg) 62%) var(--bg);
  color: var(--ink); font-family: var(--font);
  margin: 0; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
  transition: background .6s ease, color .6s ease;
}
button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--wood); outline-offset: 3px; }
button { transition: transform .15s ease; }
button:active { transform: scale(.95); }
.app {
  position: relative; height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
}
.screen { position: absolute; inset: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.screen[hidden] { display: none !important; }
h1 { font-size: clamp(28px, 5vw, 44px); margin: 0; font-weight: 400; letter-spacing: .04em; text-wrap: balance; text-align: center; }
.hint { color: var(--soft); font-size: 18px; margin: 0; text-align: center; }

/* 開場 */
.big-sun {
  width: 200px; height: 200px; border-radius: 50%; border: none; cursor: pointer;
  background: radial-gradient(circle at 40% 38%, #F3D49A, var(--sun) 70%);
  box-shadow: 0 0 0 18px color-mix(in srgb, var(--sun) 22%, transparent);
  font-size: 34px; color: #5B4426; animation: breathe 4s ease-in-out infinite; position: relative; z-index: 1;
}
#start h1 { font-size: clamp(34px, 6vw, 56px); position: relative; z-index: 1; }
#start h1 small { display: block; font-size: .42em; color: var(--soft); letter-spacing: .12em; margin-top: 6px; }
#start .hint { position: relative; z-index: 1; }
.friends { display: flex; gap: clamp(10px, 2.4vw, 22px); font-size: clamp(34px, 6vw, 52px); line-height: 1; position: relative; z-index: 1; }
.friends span { animation: bob 3.2s ease-in-out infinite; }
.friends span:nth-child(2n) { animation-delay: -1.6s; }
.friends span:nth-child(3n) { animation-delay: -.8s; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.scenery { position: absolute; inset: -16px; overflow: hidden; pointer-events: none; z-index: 0; }
.scenery .hill { position: absolute; border-radius: 50%; }
.scenery .h1 { left: -12%; right: 38%; bottom: -26%; height: 46%; background: color-mix(in srgb, var(--ok) 32%, var(--bg)); }
.scenery .h2 { left: 30%; right: -15%; bottom: -30%; height: 48%; background: color-mix(in srgb, var(--land) 45%, var(--bg)); }
.scenery .cl { position: absolute; width: 130px; height: 42px; border-radius: 30px; background: var(--cloud); animation: drift 40s ease-in-out infinite alternate; }
.scenery .cl::before, .scenery .cl::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.scenery .cl::before { width: 58px; height: 58px; left: 22px; top: -28px; }
.scenery .cl::after { width: 44px; height: 44px; left: 66px; top: -18px; }
.scenery .c1 { left: 9%; top: 16%; }
.scenery .c2 { right: 10%; top: 26%; transform: scale(.8); animation-duration: 55s; animation-direction: alternate-reverse; }
@keyframes drift { to { translate: 60px 0; } }
@keyframes breathe { 50% { box-shadow: 0 0 0 28px color-mix(in srgb, var(--sun) 14%, transparent); } }

/* 家長選時間 */
.choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.choice {
  min-width: 120px; min-height: 96px; border-radius: 22px; border: 3px solid transparent;
  background: var(--panel); font-size: 30px; cursor: pointer; padding: 8px 20px; box-shadow: var(--lift);
}
.choice small { display: block; font-size: 16px; color: var(--soft); }
.choice.on { border-color: var(--wood); }

/* 選單 */
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 16px; width: min(1000px, 100%); max-height: 100%; min-height: 0; overflow-y: auto; touch-action: pan-y; padding: 4px; box-sizing: border-box; }
#menu { padding-top: 70px; box-sizing: border-box; }
.tile {
  aspect-ratio: 1; max-width: 100%; border: none; border-radius: 28px; cursor: pointer;
  background: color-mix(in srgb, var(--tint, var(--panel)) var(--tint-amt), var(--panel)); box-shadow: var(--lift);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  font-size: 20px; white-space: nowrap; outline: 4px solid transparent; outline-offset: -4px; transition: transform .2s ease, outline-color .2s ease;
}
.tile .pic { font-size: 56px; line-height: 1; filter: drop-shadow(0 3px 2px color-mix(in srgb, var(--ink) 14%, transparent)); }
.tile.armed { outline-color: var(--wood); animation: armed 1.6s ease-in-out infinite; }
.tile.armed .pic { animation: hop .6s ease; }
@keyframes armed { 50% { transform: scale(1.05); } }
.tile.locked { opacity: .45; }

/* 頂部列 */
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.home {
  width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--panel);
  font-size: 30px; cursor: pointer; box-shadow: var(--lift);
}
.skybox { width: 96px; height: 56px; border-radius: 16px; background: linear-gradient(var(--sky), color-mix(in srgb, var(--sky) 60%, var(--bg))); position: relative; overflow: hidden; box-shadow: var(--lift); }
.skybox .s { position: absolute; left: 34px; width: 28px; height: 28px; border-radius: 50%; background: var(--sun); transition: top 1s linear, background 2s; }
.skybox .hill { position: absolute; left: -10px; right: -10px; bottom: -22px; height: 36px; border-radius: 50%; background: var(--land); }

/* 家長鈕（長按） */
.parent {
  position: absolute; right: 0; bottom: 0; width: 56px; height: 56px; border-radius: 50%;
  border: none; background: transparent; cursor: pointer; z-index: 20; font-size: 22px; color: var(--soft);
  margin-right: env(safe-area-inset-right, 0px); margin-bottom: env(safe-area-inset-bottom, 0px);
}
.parent svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.parent circle { fill: none; stroke: var(--wood); stroke-width: 4; stroke-dasharray: 160; stroke-dashoffset: 160; }
.parent.holding circle { transition: stroke-dashoffset 3s linear; stroke-dashoffset: 0; }

/* 動物遊戲 */
#game { justify-content: stretch; gap: 16px; padding-top: 76px; box-sizing: border-box; }
.zones { flex: 1; width: 100%; display: flex; gap: 14px; min-height: 0; }
.zone {
  flex: 1; border-radius: 26px; position: relative; display: flex; flex-direction: column; align-items: center;
  padding: 14px; box-sizing: border-box; min-width: 0; transition: transform .3s ease, box-shadow .3s ease;
}
.zone { box-shadow: var(--sink); --roof: clamp(34px, 7vh, 64px); margin-top: var(--roof); border-radius: 0 0 22px 22px; }
/* 家做成小房子：上面加屋頂 */
.zone::before { content: ""; position: absolute; left: -10px; right: -10px; bottom: 100%; height: var(--roof); background: var(--roofc); clip-path: polygon(50% 0, 100% 100%, 0 100%); pointer-events: none; }
.zone[data-z="water"] { --roofc: color-mix(in srgb, var(--water) 55%, var(--wood)); }
.zone[data-z="land"] { --roofc: color-mix(in srgb, var(--land) 45%, var(--wood)); }
.zone[data-z="sky"] { --roofc: color-mix(in srgb, var(--sky) 55%, var(--wood)); }
.zone[data-z="water"] { background: radial-gradient(60% 30% at 30% 100%, color-mix(in srgb, var(--water) 70%, var(--ink)) -60%, transparent 70%), linear-gradient(color-mix(in srgb, var(--water) 70%, var(--bg)), var(--water)); }
.zone[data-z="land"] { background: radial-gradient(80% 26% at 50% 104%, color-mix(in srgb, var(--ok) 70%, var(--land)), transparent 72%), linear-gradient(color-mix(in srgb, var(--land) 70%, var(--bg)), var(--land)); }
.zone[data-z="sky"] { background: radial-gradient(30% 14% at 72% 22%, var(--cloud), transparent 70%), radial-gradient(24% 11% at 26% 52%, var(--cloud), transparent 70%), linear-gradient(color-mix(in srgb, var(--sky) 60%, var(--bg)), var(--sky)); }
.zone .label { font-size: 58px; line-height: 1; border: none; background: none; cursor: pointer; padding: 6px; }
.zone .home-of { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: flex-start; margin-top: 10px; font-size: 46px; }
.zone .home-of span { animation: settle .5s ease; }
@keyframes settle { from { transform: scale(1.4); } }
.zone.near { box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--ink) 25%, transparent); }
.zone.hint-me { animation: glow 1.6s ease-in-out 2; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 8px var(--sun); } }
.tray { height: 188px; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
.animal {
  font-size: 136px; line-height: 1; width: 172px; height: 172px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--panel); cursor: grab; touch-action: none; position: relative; z-index: 10; box-shadow: var(--lift);
}
.lifting { z-index: 40 !important; filter: drop-shadow(0 12px 10px color-mix(in srgb, var(--ink) 22%, transparent)); will-change: transform; }
.animal.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.done-row { display: flex; gap: 26px; }
.round-btn { width: 120px; height: 120px; border-radius: 50%; border: none; background: var(--panel); font-size: 54px; cursor: pointer; box-shadow: var(--lift); }
.done-row { animation: settle .5s ease; }
/* 完成時慢慢飄起的小星星（不閃爍） */
.cheer { position: fixed; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
.cheer i { position: absolute; bottom: -40px; font-style: normal; font-size: 34px; opacity: 0; animation: rise 2.8s ease-out forwards; }
@keyframes rise { 15% { opacity: .85; } 100% { opacity: 0; transform: translateY(-62vh) rotate(25deg); } }

/* 顏色、形狀共用 */
#play { gap: 30px; padding-top: 76px; box-sizing: border-box; }
.board { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
.slot { width: clamp(72px, 12.5vw, 130px); aspect-ratio: 1; max-width: 100%; border-radius: 18px; border: 3px dashed color-mix(in srgb, var(--ink) 22%, transparent); box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: box-shadow .4s ease; }
.slot.glow { box-shadow: 0 0 0 5px var(--sun); }
.tray2 { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 130px; width: 100%; border-radius: 26px; background: var(--panel); padding: 12px; box-sizing: border-box; box-shadow: var(--sink); }
.tray2:empty { visibility: hidden; }
.chip { width: clamp(66px, 11.5vw, 120px); aspect-ratio: 1; border-radius: 14px; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }
.chip.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
/* 顏色排排站：可愛的形狀 */
.chip svg, .ghost-shape { width: 100%; height: 100%; display: block; overflow: visible; }
.board.colors .slot { position: relative; border: none; }
.board.colors .chip { width: clamp(66px, 11.5vw, 120px); height: auto; border-radius: 0; background: none; filter: drop-shadow(0 3px 3px color-mix(in srgb, var(--ink) 16%, transparent)); }
.ghost-shape { position: absolute; inset: 0; fill: color-mix(in srgb, var(--ink) 5%, transparent); stroke: color-mix(in srgb, var(--ink) 28%, transparent); stroke-width: 2.5; stroke-dasharray: 6 5; }
.slot .chip { position: relative; }
.slot.glow { box-shadow: none; }
.slot.glow .ghost-shape { stroke: var(--ok); stroke-dasharray: none; stroke-width: 4; }
.board.th-bug { gap: 0; align-items: center; }
.board.th-bug .slot { margin-left: calc(clamp(72px, 12.5vw, 130px) * -.12); }
.bug-head { width: clamp(80px, 14vw, 146px); aspect-ratio: 1; position: relative; z-index: 2; }
.bug-head svg { width: 100%; height: 100%; display: block; }
.board.alive .bug-head { animation: wave 1.1s ease-in-out 3; }
.board.alive.th-bug .chip { animation: wave 1.1s ease-in-out 3; }
.board.alive.th-pencil .chip { animation: hop .7s ease 3; }
.board.alive.th-balloon .chip { animation: sway 2.2s ease-in-out 2; }
.board.alive.th-fish .chip { animation: swim 1.4s ease-in-out 3; }
@keyframes wave { 50% { transform: translateY(-14px); } }
@keyframes sway { 30% { transform: translateY(-16px) rotate(-5deg); } 70% { transform: translateY(-8px) rotate(5deg); } }
@keyframes swim { 50% { transform: translateX(-10px) rotate(-6deg); } }
.hop { animation: hop .6s ease; }
@keyframes hop { 40% { transform: translateY(-18px); } }
.shape-board { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(20px, 4vw, 48px); width: min(900px, 100%); padding: 32px 26px; box-sizing: border-box; border-radius: 30px;
  background: repeating-linear-gradient(94deg, transparent 0 34px, color-mix(in srgb, var(--ink) 4%, transparent) 34px 36px, transparent 36px 61px, color-mix(in srgb, #fff 6%, transparent) 61px 64px), linear-gradient(180deg, color-mix(in srgb, var(--wood) 42%, var(--bg)), color-mix(in srgb, var(--wood) 60%, var(--bg)));
  border: 7px solid color-mix(in srgb, var(--wood) 78%, var(--ink)); box-shadow: var(--lift), inset 0 3px 0 color-mix(in srgb, #fff 22%, transparent), inset 0 -4px 10px color-mix(in srgb, var(--ink) 12%, transparent); }
.hole { width: clamp(92px, 14vw, 142px); aspect-ratio: 1; max-width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
.hole svg, .piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hole > svg + svg { position: absolute; inset: 0; animation: settle .45s ease; }
.hole .h { fill: color-mix(in srgb, var(--ink) 30%, var(--wood)); }
.hole .rim { stroke: color-mix(in srgb, #fff 30%, var(--wood)); }
.hole.in > svg:first-child { visibility: hidden; }
.piece { width: clamp(92px, 14vw, 142px); aspect-ratio: 1; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; filter: drop-shadow(0 4px 4px color-mix(in srgb, var(--ink) 22%, transparent)); }
.piece.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }

/* 數一數、整理房間 */
.baskets { display: flex; gap: clamp(16px, 4vw, 40px); justify-content: center; flex-wrap: wrap; width: 100%; }
.basket { width: clamp(150px, 24vw, 230px); min-height: 190px; border-radius: 22px 22px 60px 60px; background: repeating-linear-gradient(90deg, transparent 0 18px, color-mix(in srgb, var(--ink) 6%, transparent) 18px 21px), color-mix(in srgb, var(--wood) 55%, var(--bg)); display: flex; flex-direction: column; align-items: center; padding: 12px; box-sizing: border-box; gap: 8px; transition: box-shadow .4s ease; box-shadow: var(--lift); }
.basket .num { font-size: 54px; line-height: 1; border: none; background: none; cursor: pointer; font-family: inherit; color: var(--ink); }
.basket .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 42px; }
.basket.full { box-shadow: 0 0 0 5px var(--ok), var(--lift); }
.item { font-size: 78px; line-height: 1; width: 106px; height: 106px; display: flex; align-items: center; justify-content: center; border-radius: 50%; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }
.item.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.room { display: flex; gap: 14px; width: 100%; justify-content: center; flex-wrap: wrap; border-radius: 28px; padding: 16px; box-sizing: border-box; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); transition: background 1.2s ease, box-shadow 1.2s ease; }
.room.lit { background: color-mix(in srgb, var(--sun) 28%, var(--bg)); box-shadow: 0 0 60px color-mix(in srgb, var(--sun) 40%, transparent); }
.spot { flex: 1 1 150px; max-width: 250px; min-height: 170px; border-radius: 20px; background: var(--panel); box-shadow: var(--lift); display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; }
.spot .label { font-size: 58px; border: none; background: none; cursor: pointer; padding: 4px; }
.spot .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 42px; }
.spot.hint-me { animation: glow 1.6s ease-in-out 2; }

/* 數字連連看 */
.dots-wrap { width: min(640px, 100%, 64vh); aspect-ratio: 1; max-width: 100%; touch-action: none; }
.dots-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.dots-wrap .line { stroke: var(--wood); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.dots-wrap .fill { fill: color-mix(in srgb, var(--sun) 45%, var(--bg)); opacity: 0; transition: opacity 1s ease; }
.dots-wrap .fill.on { opacity: 1; }
.dots-wrap .dot { fill: var(--panel); stroke: var(--soft); stroke-width: .8; }
.dots-wrap .dot.next { fill: var(--sun); animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dots-wrap .dot.done { fill: var(--wood); }
.dots-wrap .n { font: 6px var(--font); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dots-wrap .who { font-size: 34px; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity 1s ease .3s; }
.dots-wrap .who.on { opacity: 1; }
@keyframes pulse { 50% { transform: scale(1.25); } }

/* 名稱字卡（中文＋英文） */
.caption { min-height: 64px; display: flex; align-items: baseline; justify-content: center; gap: 14px; text-align: center; }
.caption .zh { font-size: 40px; letter-spacing: .06em; }
.caption .en { font-size: 26px; color: var(--soft); }
.caption.pop { animation: settle .4s ease; }

/* 認識東西 */
#learn { justify-content: flex-start; gap: 18px; padding-top: 76px; box-sizing: border-box; }
.cats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.cat { min-width: 108px; min-height: 88px; border-radius: 20px; border: 3px solid transparent; background: var(--panel); box-shadow: var(--lift); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 16px; padding: 6px 12px; }
.cat .pic { font-size: 42px; line-height: 1; }
.cat.on { border-color: var(--wood); }
.learn-main { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 34%); gap: 18px; }
@media (max-width: 700px) { .learn-main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .learn-main .bigcard { order: -1; } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; overflow-y: auto; align-content: start; min-height: 0; padding: 4px; touch-action: pan-y; }
.lcard { aspect-ratio: 1; max-width: 100%; border-radius: 20px; border: 3px solid transparent; background: var(--panel); box-shadow: var(--lift); font-size: 68px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.lcard.on { border-color: var(--wood); }
.bigcard { border-radius: 28px; background: radial-gradient(80% 60% at 50% 30%, color-mix(in srgb, var(--sun) 16%, var(--panel)), var(--panel)); box-shadow: var(--lift); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; min-height: 0; text-align: center; }
.bigcard .pic { font-size: clamp(90px, 15vw, 150px); line-height: 1; }
.bigcard .zh { font-size: 42px; letter-spacing: .06em; }
.bigcard .en { font-size: 28px; color: var(--soft); }
.bigcard.pop .pic { animation: settle .4s ease; }

/* 第四版新增遊戲 */
.hint-me { animation: glow 1.6s ease-in-out 2; }
.pop { animation: settle .5s ease; }
.listen { width: 170px; height: 170px; font-size: 80px; }
.lcard.pick { width: clamp(118px, 25vw, 184px); font-size: clamp(74px, 15vw, 116px); }
.sizes { align-items: flex-end; gap: clamp(6px, 1.4vw, 14px); }

.sz { --u: clamp(62px, 14.5vw, 152px); width: calc(var(--u) * var(--k)); height: calc(var(--u) * var(--k)); font-size: calc(var(--u) * var(--k) * .86); line-height: 1; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }

.puz { width: min(680px, 100%, calc(48vh * var(--c) / var(--r))); display: grid; grid-template-columns: repeat(var(--c), 1fr); border-radius: 18px; overflow: hidden; position: relative; background: color-mix(in srgb, var(--panel) 70%, var(--bg)); transition: box-shadow .5s ease; }

/* 手機直立：大小稍微縮一點，整個畫面放得下 */

}

/* 休息 */

.sleeper { font-size: 120px; line-height: 1; position: relative; }
.zzz { position: absolute; right: -36px; top: -10px; font-size: 32px; color: var(--soft); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-14px); opacity: .5; } }
.rest-step { font-size: 30px; text-align: center; min-height: 1.4em; }
.dots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: background 1s ease; }
.dots i.on { background: var(--wood); }

/* 家長面板 */
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.card { background: var(--bg); border-radius: 24px; padding: 26px; width: min(560px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
.card h2 { margin: 0; font-weight: 400; font-size: 26px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row > span { min-width: 92px; color: var(--soft); font-size: 18px; }
.pill { border: 2px solid var(--panel); background: var(--panel); border-radius: 999px; padding: 10px 18px; font-size: 18px; cursor: pointer; min-height: 48px; }
.pill.on { border-color: var(--wood); }
.act { border: none; border-radius: 16px; padding: 14px 20px; font-size: 20px; cursor: pointer; background: var(--wood); color: #FFF8EC; min-height: 56px; }
.act.plain { background: var(--panel); color: var(--ink); }
.q { font-size: 36px; text-align: center; font-variant-numeric: tabular-nums; }
.answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.answers button { font-size: 28px; padding: 14px; border-radius: 16px; border: none; background: var(--panel); cursor: pointer; font-variant-numeric: tabular-nums; }
.wrong-note { color: var(--soft); text-align: center; min-height: 1.2em; margin: 0; }

/* 直立：家矮一點、動物大一點 */
@media (orientation: portrait) {
  #game { justify-content: center; }
  .zones { flex: none; height: min(36vh, 420px); }
  .tray { height: auto; min-height: min(270px, 60vw); }

}

/* ===== 新遊戲（分案B）共用 ===== */
.board.qz { flex: 1 1 auto; min-height: 0; flex-direction: column; flex-wrap: nowrap; align-items: center; gap: 12px; }
.qz .stage { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: safe center; overflow-y: auto; gap: 12px; }
.qz .qmain:has(.addrow), .qz .qmain:has(.plates) { flex-direction: column; flex-wrap: nowrap; }
#play .tray2 { flex-shrink: 0; }
.qz .qmain { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 30px); flex-wrap: wrap; }
.seg { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.seg button { border: none; border-radius: 22px; background: var(--panel); padding: 10px 20px; font-size: 22px; box-shadow: var(--lift); cursor: pointer; min-height: 52px; }
.seg button.on { outline: 3px solid var(--wood); background: color-mix(in srgb, var(--sun) 25%, var(--panel)); }
.prog { display: flex; gap: 10px; }
.prog i { width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: var(--sink); transition: background .4s ease; }
.prog i.on { background: var(--ok); }
.qopt { width: min(22vw, 25vh, 180px); aspect-ratio: 1; border: none; border-radius: 26px; background: var(--bg); box-shadow: var(--lift); font-size: min(13vw, 15vh, 104px); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 10px; box-sizing: border-box; line-height: 1; flex: none; }
.qopt svg { width: 100%; height: 100%; display: block; }
.qopt.txt { font-size: min(9vw, 11vh, 72px); }
.qopt.nope { animation: nope .45s ease; }
@keyframes nope { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.qopt.hint-me { animation: glowb 1.6s ease-in-out 2; }
@keyframes glowb { 50% { box-shadow: 0 0 0 8px var(--sun); } }
.qopt.right { box-shadow: 0 0 0 6px var(--ok); }
.eq { font-size: clamp(30px, 5vw, 54px); letter-spacing: .06em; }
.ans { display: inline-block; min-width: 1.2em; text-align: center; color: var(--wood); }
/* 1. 猜猜另一半 */
.halfbox { position: relative; width: min(44vw, 40vh, 340px); aspect-ratio: 1; border-radius: 30px; background: var(--panel); box-shadow: var(--sink); display: flex; align-items: center; justify-content: center; }
.halfbox::after { content: ""; position: absolute; top: 8%; bottom: 8%; left: 50%; border-left: 3px dashed color-mix(in srgb, var(--ink) 25%, transparent); pointer-events: none; transition: opacity .6s ease; }
.halfbox:has(.full)::after { opacity: 0; }
.halfpic { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: min(30vw, 28vh, 230px); line-height: 1; transition: clip-path .8s ease; clip-path: inset(-10% -10% -10% -10%); }
.halfbox .halfpic { width: 84%; height: 84%; }
.qopt .halfpic { font-size: inherit; }
.halfpic svg { width: 100%; height: 100%; }
.halfpic.L { clip-path: inset(-10% 50% -10% -10%); }
.halfpic.R { clip-path: inset(-10% -10% -10% 50%); }
/* 2. 摺摺看 */
.netbox { width: min(46vw, 42vh, 340px); aspect-ratio: 1; border-radius: 30px; background: var(--panel); box-shadow: var(--sink); padding: 14px; box-sizing: border-box; }
.netbox svg { width: 100%; height: 100%; display: block; }
.netobj { font-size: min(22vw, 24vh, 170px); line-height: 1; }
/* 4. 時鐘 */
.clockbox { width: min(46vw, 42vh, 360px); aspect-ratio: 1; }
.clock { width: 100%; height: 100%; display: block; }
.clock .ear { fill: color-mix(in srgb, var(--wood) 80%, #fff); }
.clock .rim { fill: var(--wood); }
.clock .face { fill: #FBF6EC; }
.clock .tick { stroke: #CDBFA6; stroke-width: 1.5; }
.clock .tick.big { stroke: #8A7E6C; stroke-width: 3; }
.clock .num { font: 19px var(--font); fill: #4A4237; text-anchor: middle; dominant-baseline: central; }
.clock .hh { stroke: #C98B7A; stroke-width: 10; stroke-linecap: round; }
.clock .mh { stroke: #7E9CC0; stroke-width: 6; stroke-linecap: round; }
.clock .pin { fill: #6E5A44; }
.clock .hh, .clock .mh { transition: transform .25s ease; }
.clockbox.turn { touch-action: none; cursor: grab; }
.clockbox.turn .hh { stroke-width: 13; filter: drop-shadow(0 0 4px #E8B86A); }
.qopt.clk { padding: 6px; }
.tl { display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.05; }
.tl small { font-size: .5em; color: var(--soft); }
.qopt.time { font-size: min(6vw, 7vh, 56px); white-space: nowrap; }
.tbig { font-size: clamp(40px, 7vw, 76px); }
/* 5–7. 字母、50音、注音 */
.glyphs { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; overflow-y: auto; touch-action: pan-y; padding: 4px; box-sizing: border-box; align-content: start; }
.glyphs.abc { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.glyphs.abc .glyph { font-size: 46px; }
.glyphs.kana { grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 640px; }
.glyph { aspect-ratio: 1.15; border: none; border-radius: 18px; background: var(--panel); font-size: 38px; box-shadow: var(--lift); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 2px; }
.glyph small, .qopt small { font-size: .5em; color: var(--soft); }
.glyph.on { outline: 3px solid var(--wood); }
.gcard { display: flex; align-items: center; gap: clamp(12px, 3vw, 30px); }
.gcard .g { font-size: clamp(54px, 9vw, 96px); display: flex; align-items: baseline; gap: 8px; line-height: 1; }
.gcard .g small { font-size: .55em; color: var(--soft); }
.gcard .p { font-size: clamp(50px, 8vw, 86px); line-height: 1; }
.gcard .w { font-size: clamp(26px, 4vw, 40px); display: flex; flex-direction: column; }
.gcard .w small { font-size: .65em; color: var(--soft); }
.qmain .gcard { background: var(--panel); border-radius: 30px; padding: 18px 30px; box-shadow: var(--lift); }
.abcm .spot .label { font-size: 64px; }
.item.gl { font-size: 70px; background: var(--bg); box-shadow: var(--lift); }
.gl-in { font-size: 60px; }
/* 8. 九九乘法 */
.seg.rows button { min-width: 56px; font-size: 26px; padding: 8px 12px; }
.mulcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(560px, 100%); }
.mulc { border: none; border-radius: 18px; background: var(--panel); box-shadow: var(--lift); font-size: clamp(22px, 3.4vw, 32px); padding: 10px 6px; cursor: pointer; font-family: inherit; }
.mulc.on { outline: 3px solid var(--wood); }
.mulshow { display: flex; align-items: center; gap: 22px; }
.dotgrid { display: grid; grid-template-columns: repeat(var(--c), 1fr); gap: 4px; }
.dotgrid i { width: clamp(9px, 1.6vw, 15px); aspect-ratio: 1; border-radius: 50%; }
.mt { font-size: clamp(30px, 5vw, 50px); display: flex; flex-direction: column; }
.mt small { font-size: .62em; color: var(--wood); letter-spacing: .1em; }
.plates { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.plate { padding: 10px 16px; border-radius: 999px; background: var(--panel); box-shadow: var(--sink); font-size: clamp(28px, 4.6vw, 48px); letter-spacing: 2px; }
/* 9. 看圖加法 */
.addrow { display: flex; align-items: center; gap: clamp(8px, 2vw, 20px); flex-wrap: wrap; justify-content: center; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; max-width: min(30vw, 260px); justify-content: center; padding: 10px; border-radius: 24px; background: var(--panel); box-shadow: var(--sink); }
.cnt { position: relative; border: none; background: none; font-size: min(7vw, 9vh, 74px); line-height: 1; padding: 4px; cursor: pointer; }
.cnt.on::after { content: attr(data-n); position: absolute; right: -2px; top: -4px; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 20px; line-height: 30px; text-align: center; }
.op { font-size: clamp(36px, 6vw, 64px); color: var(--soft); font-weight: 400; }
.addrow .ans { font-size: clamp(48px, 8vw, 84px); font-weight: 400; }
/* 10. 兔兔公主 */
.pr-stage { height: 100%; min-height: 0; display: flex; justify-content: center; }
.princess { height: 100%; max-height: 62vh; width: auto; aspect-ratio: 200 / 340; display: block; }
.princess .glow { fill: none; stroke: #E8B86A; stroke-width: 6; opacity: .8; animation: breatheS 2.4s ease-in-out infinite; }
@keyframes breatheS { 50% { opacity: .3; } }
.ptabs button { font-size: 20px; padding: 8px 14px; min-height: 48px; }
.pitems { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.pitem { width: 86px; height: 86px; border: none; border-radius: 22px; background: var(--bg); box-shadow: var(--lift); padding: 8px; box-sizing: border-box; cursor: pointer; font-size: 44px; display: flex; align-items: center; justify-content: center; }

    rainboots: '<svg class="ic" viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"><path d="M26 10h30v50l26 8c8 3 10 10 10 16v6H18V18c0-5 3-8 8-8z" fill="#E2BC52"/><path d="M18 84h74v6H18z" fill="#A98A3C"/><rect x="22" y="10" width="38" height="8" rx="3" fill="#C9A23E"/></svg>',
    wardrobe: '<svg class="ic" viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"><rect x="16" y="8" width="68" height="80" rx="5" fill="#B08A5A"/><rect x="21" y="14" width="27" height="68" rx="3" fill="#C8A577"/><rect x="52" y="14" width="27" height="68" rx="3" fill="#C8A577"/><circle cx="44" cy="50" r="3" fill="#6E5338"/><circle cx="56" cy="50" r="3" fill="#6E5338"/><rect x="20" y="88" width="8" height="6" fill="#8E6A4A"/><rect x="72" y="88" width="8" height="6" fill="#8E6A4A"/></svg>',
    shoerack: '<svg class="ic" viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"><rect x="10" y="20" width="6" height="72" fill="#8E6A4A"/><rect x="84" y="20" width="6" height="72" fill="#8E6A4A"/><rect x="10" y="46" width="80" height="6" fill="#B08A5A"/><rect x="10" y="84" width="80" height="6" fill="#B08A5A"/><path d="M20 46v-12h12l12 6c3 2 4 4 4 6z" fill="#8FA9C0"/><path d="M54 46v-12h12l12 6c3 2 4 4 4 6z" fill="#D9776B"/><path d="M20 84v-12h12l12 6c3 2 4 4 4 6z" fill="#E2BC52"/><path d="M54 84v-12h12l12 6c3 2 4 4 4 6z" fill="#8FAE8B"/></svg>',
    toybox: '<svg class="ic" viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"><circle cx="36" cy="30" r="14" fill="#D9776B"/><path d="M58 34l8-22 8 22z" fill="#8FA9C0"/><rect x="10" y="40" width="80" height="50" rx="6" fill="#B08A5A"/><rect x="6" y="36" width="88" height="12" rx="4" fill="#C8A577"/><path d="M50 56l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z" fill="#E2C267"/></svg>',
  };
  // ---------- 儲存 ----------
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const settings = Object.assign({ lvCount: 1, stCount: 0, lvTidy: 1, stTidy: 0, lvColors: 1, stColors: 0, lvShapes: 1, stShapes: 0, play: 15, rest: 20, night: false, sound: true, music: 'lullaby', musicVol: 1, level: 1, streak: 0, voice: 'sister', voiceName: '', rec: 'A', enRec: 'A' }, load('wt_settings', {}));
  // 輕柔的姐姐聲：音調只微調，避免變得像機器
  const VOICES = { girl: { pitch: 1.4, rate: 0.9 }, sister: { pitch: 1.12, rate: 0.88 } };
  let session = load('wt_session', null); // { end, warned, restEnd }
  const saveSettings = () => save('wt_settings', settings);
  if (!settings.v3) { settings.voice = 'sister'; settings.v3 = true; saveSettings(); } // 第三版改用輕柔姐姐聲
  // 家長設定不再提供「用裝置語音」，之前選了的改回錄好的聲音（沒有錄音的句子程式仍會自動用裝置語音補）
  if (settings.rec === 'off' || settings.enRec === 'off') { if (settings.rec === 'off') settings.rec = 'A'; if (settings.enRec === 'off') settings.enRec = 'K'; saveSettings(); }
  const saveSession = () => save('wt_session', session);
  const applyNight = () => document.documentElement.classList.toggle('night', !!settings.night);
  applyNight();

  // ---------- 聲音 ----------
  let voice = null, enVoice = null, zhVoices = [];
  const isTW = (v) => /zh[-_]TW/i.test(v.lang) || /Meijia|美佳|台灣|Taiwan/i.test(v.name);
  const pickVoice = () => {
    const vs = speechSynthesis.getVoices();
    zhVoices = vs.filter(isTW);
    // 優先：家長選的聲音 → 加強版/進階版台灣聲音 → 美佳 → 任何台灣聲音（不用大陸口音的 zh-CN）
    voice = vs.find(v => v.name === settings.voiceName)
      || zhVoices.find(v => /enhanced|premium|加強|進階|增強/i.test(v.name))
      || zhVoices.find(v => /Meijia|美佳/i.test(v.name))
      || zhVoices[0] || null;
    enVoice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|enhanced|premium/i.test(v.name))
      || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  // 事先錄好的聲音檔（voice/manifest.json：文字 → 檔名）；沒有檔案的句子改用裝置語音
  const clips = { zh: {}, en: {}, voices: [], enVoices: [] };
  const recDir = () => clips.voices.includes(settings.rec) ? settings.rec + '/' : null;
  // 英文錄音：A＝姐姐 A 唸英文，K＝英語母語女聲；off 用裝置語音
  const EN_LABEL = { A: '姐姐 A', K: '英語老師' };
  const enRecV = () => settings.enRec === 'off' ? null : clips.enVoices.includes(settings.enRec) ? settings.enRec : clips.enVoices[0] || null;
  const enFile = (en) => en && enRecV() && clips.en[en] ? `en/${enRecV()}/` + clips.en[en] : null;
  // 聲音包：manifest.packs = { 'en/K': { file: 'en-K-pack.mp3', idx: { 'en001.mp3': [起點, 長度] } } }，（一個大 mp3）下載一次後切成小段播放
  // 只下載目前選用的聲音包（每包約 8MB），換聲音時再下載新的；還沒下載好之前先播單句檔
  const packData = {}, packWant = {};
  const loadPack = (k) => {
    const pk = clips.packs && clips.packs[k];
    if (!pk || packWant[k]) return; packWant[k] = true;
    fetch('voice/' + pk.file).then(r => r.ok ? r.arrayBuffer() : null).then(b => { if (b) packData[k] = { buf: b, urls: {} }; else packWant[k] = false; }).catch(() => { packWant[k] = false; });
  };
  const loadPacks = () => { if (recDir()) loadPack(settings.rec); if (enRecV()) loadPack('en/' + enRecV()); };
  const clipSrc = (f) => {
    const cut = f.lastIndexOf('/'), k = f.slice(0, cut), name = f.slice(cut + 1), d = packData[k], at = d && clips.packs[k].idx[name];
    if (!at) return 'voice/' + f;
    return d.urls[name] || (d.urls[name] = URL.createObjectURL(new Blob([d.buf.slice(at[0], at[0] + at[1])], { type: 'audio/mpeg' })));
  };
  try { fetch('voice/manifest.json').then(r => r.ok ? r.json() : null).then(m => { if (m) { Object.assign(clips, m); loadPacks(); } }).catch(() => {}); } catch {}
  const player = new Audio();
  let playToken = 0;
  const playSeq = (files, done) => {
    const t = ++playToken; let i = 0;
    const next = () => {
      if (t !== playToken) return;
      if (i >= files.length) { if (done) done(); return; }
      player.src = clipSrc(files[i++]); player.onended = () => setTimeout(next, 150);
      player.play().catch(() => {});
    };
    next();
  };
  // 說中文（可以是幾段拼起來），需要時接著說英文
  const say = (text, en) => {
    if (!settings.sound) return;
    const parts = Array.isArray(text) ? text : [text];
    const dir = recDir();
    // zhv：只有某些聲音錄好的句子（例如新遊戲先錄姐姐 C）
    const zf = (p) => clips.zh[p] || ((clips.zhv || {})[settings.rec] || {})[p];
    if (dir && parts.every(zf)) {
      try { speechSynthesis.cancel(); } catch {}
      const files = parts.map(p => dir + zf(p));
      const ef = enFile(en);
      if (ef) files.push(ef);
      playSeq(files, en && !ef ? () => say_tts('', en) : null);
      return;
    }
    playToken++; player.pause();
    say_tts(parts.join(''), en);
  };
  const say_tts = (text, en) => {
    if (!('speechSynthesis' in window)) return;
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) speechSynthesis.cancel();
    // Android Chrome 在 cancel 後馬上 speak 常會沒聲音，稍等一下再說
    setTimeout(() => speakNow(text, en), busy ? 120 : 0);
  };
  // 唸名詞：畫面上顯示中文＋英文字幕，接著唸中文和英文（spoken 是要唸的中文句子，預設就是名詞）
  let subtT = null;
  const sayName = (zh, en, spoken) => {
    if (current === 'game') showCap(zh, en);
    else if (current !== 'learn') {
      const el = $('subt'); el.innerHTML = `<span class="zh">${zh}</span><span class="en">${en}</span>`;
      el.classList.add('on'); clearTimeout(subtT); subtT = setTimeout(() => el.classList.remove('on'), 4000);
    }
    say(spoken || zh, en);
  };
  const speakNow = (text, en) => {
    try { speechSynthesis.resume(); } catch {}
    const vp = VOICES[settings.voice] || VOICES.sister;
    if (text) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; if (voice) u.voice = voice;
      u.rate = vp.rate; u.pitch = vp.pitch; u.volume = 0.8;
      speechSynthesis.speak(u);
    }
    if (en) {
      const e = new SpeechSynthesisUtterance(en);
      e.lang = 'en-US'; if (enVoice) e.voice = enVoice;
      e.rate = 0.8; e.pitch = vp.pitch; e.volume = 0.8;
      speechSynthesis.speak(e);
    }
  };
  let actx = null;
  const ding = (freq = 880) => {
    if (!settings.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.9);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 1);
    } catch {}
  };
  let audioReady = false;
  const unlockAudio = () => {
    audioReady = true;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
    try { player.muted = true; player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; player.play().catch(() => {}).finally(() => { player.muted = false; }); } catch {}
    if ('speechSynthesis' in window) { try { speechSynthesis.resume(); } catch {} pickVoice(); }
  };
  if (!('speechSynthesis' in window)) {
    const h = document.querySelector('#start .hint');
    if (h) h.textContent = '這個瀏覽器沒有語音功能，請用 Chrome 或 Safari 開啟';
  }

  // ---------- 畫面切換 ----------
  const $ = (id) => document.getElementById(id);

  const HR = ['十二', '一', '兩', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
  const timeZh = (h, m) => `${HR[h]}點${m ? '半' : ''}`;
  const timeEn = (h, m) => m ? `Half past ${NUM_EN[h].toLowerCase()}` : `${NUM_EN[h]} o'clock`;
  const timeTxt = (h, m) => `<span class="tl">${h} 點${m ? '半' : ''}<small>${h}:${m ? '30' : '00'}</small></span>`;
  const handA = (h, m) => (h % 12) * 30 + m / 2;
  const clockSVG = (h, m) => {
    let s = '';
    for (let k = 0; k < 60; k++) { const a = k * Math.PI / 30, r1 = k % 5 ? 80 : 76; s += `<line class="tick${k % 5 ? '' : ' big'}" x1="${(100 + r1 * Math.sin(a)).toFixed(1)}" y1="${(100 - r1 * Math.cos(a)).toFixed(1)}" x2="${(100 + 84 * Math.sin(a)).toFixed(1)}" y2="${(100 - 84 * Math.cos(a)).toFixed(1)}"/>`; }
    for (let k = 1; k <= 12; k++) { const a = k * Math.PI / 6; s += `<text class="num" x="${(100 + 64 * Math.sin(a)).toFixed(1)}" y="${(100 - 64 * Math.cos(a)).toFixed(1)}">${k}</text>`; }
    return `<svg class="clock" viewBox="0 0 200 200" aria-hidden="true"><circle class="ear" cx="36" cy="34" r="22"/><circle class="ear" cx="164" cy="34" r="22"/><circle class="rim" cx="100" cy="100" r="95"/><circle class="face" cx="100" cy="100" r="86"/>${s}
      <line class="mh" x1="100" y1="100" x2="100" y2="42" transform="rotate(${m * 6} 100 100)"/><line class="hh" x1="100" y1="100" x2="100" y2="62" transform="rotate(${handA(h, m)} 100 100)"/><circle class="pin" cx="100" cy="100" r="7"/></svg>`;
  };
  const pickTime = () => [1 + rnd(12), settings.clockHalf && Math.random() < .5 ? 30 : 0];
  const CLOCK = { modes: [['q', '']], run: { q: (stage, tray, again) => quizRun(stage, tray, 3, (i) => {
    const [h, m] = pickTime(), kind = i % 3;
    const right = () => {
      settings.clockOk = (settings.clockOk || 0) + 1;
      if (!settings.clockHalf && settings.clockOk >= 12) settings.clockHalf = 1;
      saveSettings(); sayName(timeZh(h, m), timeEn(h, m));
    };
    // 其他兩個選項：不同的時間
    const alt = []; while (alt.length < 2) { const t = pickTime(); if (!(t[0] === h && t[1] === m) && !alt.some(a => a[0] === t[0] && a[1] === t[1])) alt.push(t); }
    const all = shuffle([[h, m], ...alt]), ok = all.findIndex(t => t[0] === h && t[1] === m);
    if (kind === 0) return {
      html: `<div class="clockbox">${clockSVG(h, m)}</div>`, opts: all.map(([a, b]) => timeTxt(a, b)), ok, cls: 'txt time',

    };
    if (kind === 1) return {
      html: `<button class="listen">👂</button><div class="tbig">${timeTxt(h, m)}</div>`, opts: all.map(([a, b]) => clockSVG(a, b)), ok, cls: 'clk',

    };

    let cur = h; while (cur === h) cur = 1 + rnd(12);
    return {
      html: `<div class="clockbox turn">${clockSVG(cur, m)}</div>`,
      mount: (st, tr, win) => {
        tr.innerHTML = `<div class="tbig">${timeTxt(h, m)}</div>`;
        const svg = st.querySelector('svg'), hh = svg.querySelector('.hh'); let drag = false;
        hh.classList.add('grab');
        const move = (e) => {
          const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
          let a = Math.atan2(x, -y) * 180 / Math.PI; if (a < 0) a += 360;
          const n = ((Math.round((a - m / 2) / 30) % 12) + 12) % 12 || 12;
          if (n !== cur) { cur = n; hh.setAttribute('transform', `rotate(${handA(cur, m)} 100 100)`); ding(420 + cur * 20); }
        };
        svg.addEventListener('pointerdown', (e) => { drag = true; try { svg.setPointerCapture(e.pointerId); } catch {} move(e); });
        svg.addEventListener('pointermove', (e) => { if (drag) move(e); });
        const up = () => { if (!drag) return; drag = false; if (cur === h) win(); else say([timeZh(cur, m), '再轉轉看']); };
        svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
      },
      ask: () => say(['用手指轉一轉短短的針，轉到', timeZh(h, m)]), right,
    };
  }, again) } };

    };
    const loc = (e) => { const r = area.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    area.addEventListener('pointerdown', (e) => { down = true; try { area.setPointerCapture(e.pointerId); } catch {} prev = loc(e); pts = [[...prev, performance.now()]]; for (const o of [...live]) if (segHit(prev, prev, o)) slice(o); });
    area.addEventListener('pointermove', (e) => {
      if (!down) return; const p = loc(e);
      for (const o of [...live]) if (segHit(prev, p, o)) slice(o);
      prev = p; pts.push([...p, performance.now()]);
    });
    const up = () => { down = false; };
    area.addEventListener('pointerup', up); area.addEventListener('pointercancel', up);
    const frame = (now) => {
      if (g !== gen || !area.isConnected) return;
      const dt = Math.min(.05, lastT ? (now - lastT) / 1000 : 0); lastT = now;
      if (!ended && live.length < 3 && now - lastSpawn > 1100) spawn(now);
      const h = area.clientHeight;
      for (const o of [...live, ...bits]) {
        o.vy += o.G * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
        if (o.fade) { o.fade = Math.max(0, o.fade - dt * 1.6); o.el.style.opacity = o.fade; }
        place(o);
      }
      const gone = (o) => o.y - o.size > h || o.fade === 0;
      for (const o of live.filter(gone)) o.el.remove();
      for (const o of bits.filter(gone)) o.el.remove();
      live = live.filter(o => !gone(o)); bits = bits.filter(o => !gone(o));
      pts = pts.filter(p => now - p[2] < 220);
      trail.setAttribute('points', pts.map(p => p[0].toFixed(0) + ',' + p[1].toFixed(0)).join(' '));
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  };

  const inRest = () => !!(session && session.restEnd && session.restEnd > Date.now());
  let graceUntil = null;
  const maybeRest = () => {
    if (!session || inRest() || session.end > Date.now()) return false;
    if (roundActive && (current === 'game' || current === 'play') && (graceUntil === null || Date.now() < graceUntil)) {
      if (graceUntil === null) graceUntil = Date.now() + 60000;
      return false;
    }
    enterRest(true); return true;
  };
  const REST_STEPS = ['看看窗外遠遠的地方', '眨眨眼睛', '伸伸懶腰', '閉上眼睛休息一下'];
  let restSpoken = -1;
  const enterRest = (fresh) => {
    graceUntil = null; roundActive = false;
    if (fresh) { session.restEnd = Date.now() + settings.rest * 60000; saveSession(); }
    restSpoken = -1;
    show('rest');
    if (fresh) say('太陽下山囉，我們休息一下');
  };
  const endRest = () => { session = null; saveSession(); show('start'); };

  const tick = () => {
    const now = Date.now();
    // 太陽位置
    if (session && session.end && !session.restEnd) {
      const total = settings.play * 60000;
      const left = Math.max(0, session.end - now);
      const p = 1 - Math.min(1, left / total);
      for (const s of document.querySelectorAll('.skybox .s')) {
        s.style.top = (6 + p * 44) + 'px';
        s.style.background = p > .85 ? '#D98E5B' : '';
      }
      if (!session.warned && left <= 120000 && left > 0) {
        session.warned = true; saveSession();
        say('太陽快要下山囉，玩完這一個就休息喔');
      }
      if (left <= 0) maybeRest();
    }
    if (current === 'rest' && session && session.restEnd) {
      const total = settings.rest * 60000;
      const left = session.restEnd - now;
      if (left <= 0) return endRest();
      const dots = $('restDots'); const n = 10;
      if (dots.children.length !== n) dots.innerHTML = '<i></i>'.repeat(n);
      const on = Math.round((1 - left / total) * n);
      [...dots.children].forEach((d, i) => d.classList.toggle('on', i < on));
      const elapsed = total - left;
      const step = Math.floor(elapsed / 20000);
      if (step < REST_STEPS.length) {
        $('restStep').textContent = REST_STEPS[step];
        if (step !== restSpoken && elapsed > 3000) { restSpoken = step; say(REST_STEPS[step]); }
      } else { $('restStep').textContent = '好好休息，等一下再玩'; }
    }
  };
  setInterval(tick, 1000);

  // ---------- 家長（長按三秒） ----------
  const pb = $('parentBtn'); let holdT = null;
  const cancelHold = () => { clearTimeout(holdT); pb.classList.remove('holding'); };
  pb.addEventListener('pointerdown', () => { pb.classList.add('holding'); holdT = setTimeout(() => { cancelHold(); openGate(); }, 3000); });
  pb.addEventListener('pointerup', cancelHold); pb.addEventListener('pointerleave', cancelHold); pb.addEventListener('pointercancel', cancelHold);

  const sheet = $('sheet');
  const close = () => { sheet.hidden = true; sheet.innerHTML = ''; };
  const openGate = () => {
    const a = 11 + Math.floor(Math.random() * 30), b = 11 + Math.floor(Math.random() * 30), ans = a + b;
    const opts = shuffle([ans, ans + 10, ans - 1, ans + 2]);
    sheet.innerHTML = `<div class="card"><h2>家長確認</h2><div class="q">${a} + ${b} = ?</div>
      <div class="answers">${opts.map(o => `<button data-v="${o}">${o}</button>`).join('')}</div>
      <p class="wrong-note" id="wn"></p><button class="act plain" id="gx">取消</button></div>`;
    sheet.hidden = false;
    sheet.querySelectorAll('.answers button').forEach(btn => btn.addEventListener('click', () => {
      if (+btn.dataset.v === ans) openPanel(); else $('wn').textContent = '答案不對，再試一次';
    }));
    $('gx').addEventListener('click', close);
  };

  const openPanel = () => {
    const pills = (key, vals, unit) => vals.map(v => `<button class="pill${settings[key] === v ? ' on' : ''}" data-k="${key}" data-v="${v}">${v}${unit}</button>`).join('');
    const left = session && session.end && !session.restEnd ? Math.max(0, Math.ceil((session.end - Date.now()) / 60000)) : null;
    const restLeft = inRest() ? Math.ceil((session.restEnd - Date.now()) / 60000) : null;
    const status = restLeft !== null ? `休息中，還有約 ${restLeft} 分鐘` : left !== null ? `遊玩中，還有約 ${left} 分鐘` : '目前沒有計時';
    sheet.innerHTML = `<div class="card"><h2>家長設定</h2><p class="hint" style="text-align:left">${status}</p>
      <div class="row"><span>遊玩時間</span>${pills('play', [10, 15, 20], ' 分')}</div>
      <div class="row"><span>休息時間</span>${pills('rest', [10, 20, 30], ' 分')}</div>
      <div class="row"><span>背景音樂</span>${[['lullaby', '音樂盒'], ['nature', '大自然'], ['xylo', '木琴'], ['off', '關']].map(([v, n]) => `<button class="pill${(settings.music || 'off') === v ? ' on' : ''}" data-music="${v}">${n}</button>`).join('')}</div>
      <div class="row"><span>音樂音量</span>${[[1, '小'], [2, '中'], [3, '大']].map(([v, n]) => `<button class="pill${settings.musicVol === v ? ' on' : ''}" data-mv="${v}">${n}</button>`).join('')}</div>
      <div class="row"><span>動物難度</span>${pills('level', [1, 2, 3], ' 級')}</div>
      <div class="row"><span>顏色難度</span>${pills('lvColors', [1, 2, 3], ' 級')}</div>
      <div class="row"><span>形狀難度</span>${pills('lvShapes', [1, 2, 3], ' 級')}</div>
      <div class="row"><span>整理難度</span>${pills('lvTidy', [1, 2, 3], ' 級')}</div>
      <div class="row"><span>時鐘</span><button class="pill${!settings.clockHalf ? ' on' : ''}" data-k="clockHalf" data-v="0">只有整點</button><button class="pill${settings.clockHalf ? ' on' : ''}" data-k="clockHalf" data-v="1">加上半點</button></div>
      <div class="row"><span>夜間模式</span><button class="pill${settings.night ? ' on' : ''}" data-k="night" data-v="1">開</button><button class="pill${!settings.night ? ' on' : ''}" data-k="night" data-v="0">關</button></div>
      <div class="row"><span>錄好的聲音</span>${clips.voices.map(v => `<button class="pill${settings.rec === v ? ' on' : ''}" data-rec="${v}">姐姐 ${v}</button>`).join('')}</div>
      <div class="row"><span>英文聲音</span>${clips.enVoices.map(v => `<button class="pill${enRecV() === v ? ' on' : ''}" data-enrec="${v}">${EN_LABEL[v] || v}</button>`).join('')}</div>
      <div class="row"><span>聲音</span><button class="pill${settings.sound ? ' on' : ''}" data-k="sound" data-v="1">開</button><button class="pill${!settings.sound ? ' on' : ''}" data-k="sound" data-v="0">關</button></div>
      <div class="row"><button class="act" id="pNew">重新開始計時</button><button class="act plain" id="pRest">現在休息</button><button class="act plain" id="pClose">關閉</button></div>
      <p class="hint" style="text-align:left;font-size:15px">提示：搭配 iPad 的「引導使用模式」可把小孩鎖在這個畫面。</p></div>`;
    sheet.hidden = false;
    sheet.querySelectorAll('.pill[data-enrec]').forEach(p => p.addEventListener('click', () => {
      settings.enRec = p.dataset.enrec; saveSettings(); loadPacks(); unlockAudio(); say('兔子', 'Rabbit'); openPanel();
    }));
    sheet.querySelectorAll('.pill[data-rec]').forEach(p => p.addEventListener('click', () => {
      settings.rec = p.dataset.rec; saveSettings(); loadPacks(); unlockAudio(); say('你好，我們一起幫兔子找家吧'); openPanel();
    }));
    sheet.querySelectorAll('.pill[data-music]').forEach(p => p.addEventListener('click', () => {
      settings.music = p.dataset.music; saveSettings(); unlockAudio(); bgmSync(); openPanel();
    }));
    sheet.querySelectorAll('.pill[data-mv]').forEach(p => p.addEventListener('click', () => {
      settings.musicVol = +p.dataset.mv; saveSettings(); openPanel();
    }));
    sheet.querySelectorAll('.pill[data-k]').forEach(p => p.addEventListener('click', () => {
      const k = p.dataset.k; let v = k === 'voice' ? p.dataset.v : +p.dataset.v;
      if (k === 'night' || k === 'sound') v = !!v;
      settings[k] = v; if (k === 'level') settings.streak = 0; if (k.startsWith('lv')) settings['st' + k.slice(2)] = 0;
      saveSettings(); applyNight(); bgmSync(); openPanel();
    }));
    $('pNew').addEventListener('click', () => { close(); unlockAudio(); session = null; saveSession(); showSetup(); });
    $('pRest').addEventListener('click', () => { close(); if (!session) session = { end: Date.now(), warned: true, restEnd: null }; session.end = Date.now(); enterRest(true); });
    $('pClose').addEventListener('click', close);
  };

  // ---------- 啟動 ----------
  if (inRest()) enterRest(false);
  else if (session && session.restEnd && session.restEnd <= Date.now()) { session = null; saveSession(); show('start'); }
  else show('start');
  tick();
})();
</script>
