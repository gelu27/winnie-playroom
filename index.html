<title>Winnie Tai 遊戲室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 版面：一次一個全螢幕畫面；米色木頭教室，低飽和、無閃爍。右上小太陽顯示剩餘時間。 */
:root {
  --bg: #F5F0E6;
  --panel: #EDE5D6;
  --ink: #4A4237;
  --soft: #8A7E6C;
  --wood: #B08A5A;
  --water: #A9C3CF;
  --land: #C7BE95;
  --sky: #D3DEE3;
  --sun: #E8B86A;
  --ok: #8FAE8B;
  --font: "Huninn", "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
  color-scheme: light;
}
:root.night {
  --bg: #3A342C;
  --panel: #463F35;
  --ink: #E6DCC8;
  --soft: #B3A68F;
  --wood: #9C7A50;
  --water: #5D7480;
  --land: #75704F;
  --sky: #5A656B;
  --sun: #C99A55;
  --ok: #6F8C6B;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  margin: 0; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
  transition: background .6s ease, color .6s ease;
}
button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--wood); outline-offset: 3px; }
.app {
  position: relative; height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
}
.screen { position: absolute; inset: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
.screen[hidden] { display: none !important; }
h1 { font-size: clamp(28px, 5vw, 44px); margin: 0; font-weight: 400; letter-spacing: .04em; text-wrap: balance; text-align: center; }
.hint { color: var(--soft); font-size: 18px; margin: 0; text-align: center; }

/* 開場 */
.big-sun {
  width: 200px; height: 200px; border-radius: 50%; border: none; cursor: pointer;
  background: radial-gradient(circle at 40% 38%, #F3D49A, var(--sun) 70%);
  box-shadow: 0 0 0 18px color-mix(in srgb, var(--sun) 22%, transparent);
  font-size: 34px; color: #5B4426; animation: breathe 4s ease-in-out infinite;
}
@keyframes breathe { 50% { box-shadow: 0 0 0 28px color-mix(in srgb, var(--sun) 14%, transparent); } }

/* 家長選時間 */
.choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.choice {
  min-width: 120px; min-height: 96px; border-radius: 22px; border: 3px solid transparent;
  background: var(--panel); font-size: 30px; cursor: pointer; padding: 8px 20px;
}
.choice small { display: block; font-size: 16px; color: var(--soft); }
.choice.on { border-color: var(--wood); }

/* 選單 */
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 22px; width: min(900px, 100%); }
.tile {
  aspect-ratio: 1; max-width: 100%; border: none; border-radius: 28px; background: var(--panel); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  font-size: 22px;
}
.tile .pic { font-size: 64px; line-height: 1; }
.tile.locked { opacity: .45; }

/* 頂部列 */
.topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.home {
  width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--panel);
  font-size: 30px; cursor: pointer;
}
.skybox { width: 96px; height: 56px; border-radius: 14px; background: var(--sky); position: relative; overflow: hidden; }
.skybox .s { position: absolute; left: 34px; width: 28px; height: 28px; border-radius: 50%; background: var(--sun); transition: top 1s linear, background 2s; }
.skybox .hill { position: absolute; left: -10px; right: -10px; bottom: -22px; height: 36px; border-radius: 50%; background: var(--land); }

/* 家長鈕（長按） */
.parent {
  position: absolute; right: 0; bottom: 0; width: 56px; height: 56px; border-radius: 50%;
  border: none; background: transparent; cursor: pointer; z-index: 20; font-size: 22px; color: var(--soft);
  margin-right: env(safe-area-inset-right, 0px); margin-bottom: env(safe-area-inset-bottom, 0px);
}
.parent svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.parent circle { fill: none; stroke: var(--wood); stroke-width: 4; stroke-dasharray: 160; stroke-dashoffset: 160; }
.parent.holding circle { transition: stroke-dashoffset 3s linear; stroke-dashoffset: 0; }

/* 動物遊戲 */
#game { justify-content: stretch; gap: 16px; padding-top: 76px; box-sizing: border-box; }
.zones { flex: 1; width: 100%; display: flex; gap: 14px; min-height: 0; }
.zone {
  flex: 1; border-radius: 26px; position: relative; display: flex; flex-direction: column; align-items: center;
  padding: 14px; box-sizing: border-box; min-width: 0; transition: transform .3s ease, box-shadow .3s ease;
}
.zone[data-z="water"] { background: var(--water); }
.zone[data-z="land"] { background: var(--land); }
.zone[data-z="sky"] { background: var(--sky); }
.zone .label { font-size: 44px; line-height: 1; border: none; background: none; cursor: pointer; padding: 6px; }
.zone .home-of { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: flex-start; margin-top: 10px; font-size: 46px; }
.zone .home-of span { animation: settle .5s ease; }
@keyframes settle { from { transform: scale(1.4); } }
.zone.near { box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--ink) 25%, transparent); }
.zone.hint-me { animation: glow 1.6s ease-in-out 2; }
@keyframes glow { 50% { box-shadow: inset 0 0 0 8px var(--sun); } }
.tray { height: 150px; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
.animal {
  font-size: 110px; line-height: 1; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--panel); cursor: grab; touch-action: none; position: relative; z-index: 10;
}
.animal.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.done-row { display: flex; gap: 26px; }
.round-btn { width: 120px; height: 120px; border-radius: 50%; border: none; background: var(--panel); font-size: 54px; cursor: pointer; }

/* 顏色、形狀共用 */
#play { gap: 30px; padding-top: 76px; box-sizing: border-box; }
.board { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; width: 100%; }
.slot { width: clamp(64px, 10.5vw, 108px); aspect-ratio: 1; max-width: 100%; border-radius: 18px; border: 3px dashed color-mix(in srgb, var(--ink) 22%, transparent); box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: box-shadow .4s ease; }
.slot.glow { box-shadow: 0 0 0 5px var(--sun); }
.tray2 { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 130px; width: 100%; border-radius: 26px; background: var(--panel); padding: 12px; box-sizing: border-box; }
.chip { width: clamp(58px, 9.5vw, 98px); aspect-ratio: 1; border-radius: 14px; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }
.chip.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.hop { animation: hop .6s ease; }
@keyframes hop { 40% { transform: translateY(-18px); } }
.shape-board { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(20px, 4vw, 48px); width: min(900px, 100%); padding: 32px 22px; box-sizing: border-box; border-radius: 28px; background: color-mix(in srgb, var(--wood) 55%, var(--bg)); }
.hole { width: clamp(78px, 11vw, 112px); aspect-ratio: 1; max-width: 100%; display: flex; align-items: center; justify-content: center; }
.hole svg, .piece svg { width: 100%; height: 100%; display: block; }
.hole .h { fill: color-mix(in srgb, var(--ink) 38%, var(--wood)); }
.piece { width: clamp(78px, 11vw, 112px); aspect-ratio: 1; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }
.piece.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }

/* 數一數、整理房間 */
.baskets { display: flex; gap: clamp(16px, 4vw, 40px); justify-content: center; flex-wrap: wrap; width: 100%; }
.basket { width: clamp(150px, 24vw, 230px); min-height: 190px; border-radius: 22px 22px 60px 60px; background: color-mix(in srgb, var(--wood) 55%, var(--bg)); display: flex; flex-direction: column; align-items: center; padding: 12px; box-sizing: border-box; gap: 8px; transition: box-shadow .4s ease; }
.basket .num { font-size: 54px; line-height: 1; border: none; background: none; cursor: pointer; font-family: inherit; color: var(--ink); }
.basket .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 34px; }
.basket.full { box-shadow: 0 0 0 5px var(--ok); }
.item { font-size: 62px; line-height: 1; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; border-radius: 50%; touch-action: none; cursor: grab; position: relative; z-index: 10; flex: none; }
.item.back { transition: transform .5s cubic-bezier(.3,.7,.3,1); }
.room { display: flex; gap: 14px; width: 100%; justify-content: center; flex-wrap: wrap; border-radius: 28px; padding: 16px; box-sizing: border-box; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); transition: background 1.2s ease, box-shadow 1.2s ease; }
.room.lit { background: color-mix(in srgb, var(--sun) 28%, var(--bg)); box-shadow: 0 0 60px color-mix(in srgb, var(--sun) 40%, transparent); }
.spot { flex: 1 1 140px; max-width: 220px; min-height: 170px; border-radius: 20px; background: var(--panel); display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; }
.spot .label { font-size: 46px; border: none; background: none; cursor: pointer; padding: 4px; }
.spot .in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 34px; }
.spot.hint-me { animation: glow 1.6s ease-in-out 2; }

/* 數字連連看 */
.dots-wrap { width: min(560px, 100%, 62vh); aspect-ratio: 1; max-width: 100%; touch-action: none; }
.dots-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.dots-wrap .line { stroke: var(--wood); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.dots-wrap .fill { fill: color-mix(in srgb, var(--sun) 45%, var(--bg)); opacity: 0; transition: opacity 1s ease; }
.dots-wrap .fill.on { opacity: 1; }
.dots-wrap .dot { fill: var(--panel); stroke: var(--soft); stroke-width: .8; }
.dots-wrap .dot.next { fill: var(--sun); animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dots-wrap .dot.done { fill: var(--wood); }
.dots-wrap .n { font: 5.2px var(--font); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dots-wrap .who { font-size: 34px; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity 1s ease .3s; }
.dots-wrap .who.on { opacity: 1; }
@keyframes pulse { 50% { transform: scale(1.25); } }

/* 名稱字卡（中文＋英文） */
.caption { min-height: 64px; display: flex; align-items: baseline; justify-content: center; gap: 14px; text-align: center; }
.caption .zh { font-size: 40px; letter-spacing: .06em; }
.caption .en { font-size: 26px; color: var(--soft); }
.caption.pop { animation: settle .4s ease; }

/* 認識東西 */
#learn { justify-content: flex-start; gap: 18px; padding-top: 76px; box-sizing: border-box; }
.cats { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.cat { min-width: 96px; min-height: 76px; border-radius: 20px; border: 3px solid transparent; background: var(--panel); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 16px; padding: 6px 12px; }
.cat .pic { font-size: 34px; line-height: 1; }
.cat.on { border-color: var(--wood); }
.learn-main { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 34%); gap: 18px; }
@media (max-width: 700px) { .learn-main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .learn-main .bigcard { order: -1; } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; overflow-y: auto; align-content: start; min-height: 0; padding: 4px; touch-action: pan-y; }
.card { aspect-ratio: 1; max-width: 100%; border-radius: 20px; border: 3px solid transparent; background: var(--panel); font-size: 54px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.card.on { border-color: var(--wood); }
.bigcard { border-radius: 28px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; min-height: 0; text-align: center; }
.bigcard .pic { font-size: clamp(90px, 15vw, 150px); line-height: 1; }
.bigcard .zh { font-size: 42px; letter-spacing: .06em; }
.bigcard .en { font-size: 28px; color: var(--soft); }
.bigcard.pop .pic { animation: settle .4s ease; }

/* 休息 */
#rest { gap: 20px; }
.moon { width: 120px; height: 120px; border-radius: 50%; box-shadow: -28px 10px 0 0 #E9D9A8; transform: translateX(14px); }
.sleeper { font-size: 120px; line-height: 1; position: relative; }
.zzz { position: absolute; right: -36px; top: -10px; font-size: 32px; color: var(--soft); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-14px); opacity: .5; } }
.rest-step { font-size: 30px; text-align: center; min-height: 1.4em; }
.dots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); }
.dots i.on { background: var(--wood); }

/* 家長面板 */
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.card { background: var(--bg); border-radius: 24px; padding: 26px; width: min(560px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
.card h2 { margin: 0; font-weight: 400; font-size: 26px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row > span { min-width: 92px; color: var(--soft); font-size: 18px; }
.pill { border: 2px solid var(--panel); background: var(--panel); border-radius: 999px; padding: 10px 18px; font-size: 18px; cursor: pointer; min-height: 48px; }
.pill.on { border-color: var(--wood); }
.act { border: none; border-radius: 16px; padding: 14px 20px; font-size: 20px; cursor: pointer; background: var(--wood); color: #FFF8EC; min-height: 56px; }
.act.plain { background: var(--panel); color: var(--ink); }
.q { font-size: 36px; text-align: center; font-variant-numeric: tabular-nums; }
.answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.answers button { font-size: 28px; padding: 14px; border-radius: 16px; border: none; background: var(--panel); cursor: pointer; font-variant-numeric: tabular-nums; }
.wrong-note { color: var(--soft); text-align: center; min-height: 1.2em; margin: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <!-- 開場 -->
  <section class="screen" id="start">
    <h1>Winnie Tai 遊戲室</h1>
    <button class="big-sun" id="startBtn" aria-label="開始">開始</button>
    <p class="hint">點太陽開始</p>
  </section>

  <!-- 家長選時間 -->
  <section class="screen" id="setup" hidden>
    <h1>家長：這次玩多久？</h1>
    <div class="choices" id="setupChoices"></div>
    <p class="hint">時間到會自動進入休息</p>
  </section>

  <!-- 選單 -->
  <section class="screen" id="menu" hidden>
    <div class="topbar"><span></span><div class="skybox" aria-hidden="true"><div class="hill"></div><div class="s"></div></div></div>
    <div class="menu" id="menuTiles"></div>
  </section>

  <!-- 動物回家 -->
  <section class="screen" id="game" hidden>
    <div class="topbar">
      <button class="home" id="homeBtn" aria-label="回選單">🏠</button>
      <div class="skybox" aria-hidden="true"><div class="hill"></div><div class="s"></div></div>
    </div>
    <div class="zones" id="zones"></div>
    <div class="caption" id="cap" aria-live="polite"></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- 認識東西 -->
  <section class="screen" id="learn" hidden>
    <div class="topbar">
      <button class="home" id="homeBtn3" aria-label="回選單">🏠</button>
      <div class="skybox" aria-hidden="true"><div class="hill"></div><div class="s"></div></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="learn-main">
      <div class="cards" id="cards"></div>
      <div class="bigcard" id="bigcard" aria-live="polite"></div>
    </div>
  </section>

  <!-- 顏色、形狀 -->
  <section class="screen" id="play" hidden>
    <div class="topbar">
      <button class="home" id="homeBtn2" aria-label="回選單">🏠</button>
      <div class="skybox" aria-hidden="true"><div class="hill"></div><div class="s"></div></div>
    </div>
    <div class="board" id="board"></div>
    <div class="tray2" id="tray2"></div>
  </section>

  <!-- 休息 -->
  <section class="screen" id="rest" hidden>
    <div class="moon" aria-hidden="true"></div>
    <div class="sleeper" aria-hidden="true">🐻<span class="zzz">z z z</span></div>
    <div class="rest-step" id="restStep">休息時間</div>
    <div class="dots" id="restDots" aria-hidden="true"></div>
  </section>

  <button class="parent" id="parentBtn" aria-label="家長設定（長按三秒）"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25"/></svg>⚙</button>
</div>

<div class="sheet" id="sheet" hidden></div>

<script>
(() => {
  // ---------- 儲存 ----------
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const settings = Object.assign({ lvCount: 1, stCount: 0, lvTidy: 1, stTidy: 0, lvColors: 1, stColors: 0, lvShapes: 1, stShapes: 0, play: 15, rest: 20, night: false, sound: true, level: 1, streak: 0, voice: 'sister', voiceName: '' }, load('wt_settings', {}));
  // 輕柔的姐姐聲：音調只微調，避免變得像機器
  const VOICES = { girl: { pitch: 1.4, rate: 0.9 }, sister: { pitch: 1.12, rate: 0.88 } };
  let session = load('wt_session', null); // { end, warned, restEnd }
  const saveSettings = () => save('wt_settings', settings);
  if (!settings.v3) { settings.voice = 'sister'; settings.v3 = true; saveSettings(); } // 第三版改用輕柔姐姐聲
  const saveSession = () => save('wt_session', session);
  const applyNight = () => document.documentElement.classList.toggle('night', !!settings.night);
  applyNight();

  // ---------- 聲音 ----------
  let voice = null, enVoice = null, zhVoices = [];
  const isTW = (v) => /zh[-_]TW/i.test(v.lang) || /Meijia|美佳|台灣|Taiwan/i.test(v.name);
  const pickVoice = () => {
    const vs = speechSynthesis.getVoices();
    zhVoices = vs.filter(isTW);
    // 優先：家長選的聲音 → 加強版/進階版台灣聲音 → 美佳 → 任何台灣聲音（不用大陸口音的 zh-CN）
    voice = vs.find(v => v.name === settings.voiceName)
      || zhVoices.find(v => /enhanced|premium|加強|進階|增強/i.test(v.name))
      || zhVoices.find(v => /Meijia|美佳/i.test(v.name))
      || zhVoices[0] || null;
    enVoice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|enhanced|premium/i.test(v.name))
      || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  // 事先錄好的聲音檔（voice/manifest.json：文字 → 檔名）；沒有檔案的句子改用裝置語音
  const clips = { zh: {}, en: {} };
  try { fetch('voice/manifest.json').then(r => r.ok ? r.json() : null).then(m => { if (m) Object.assign(clips, m); }).catch(() => {}); } catch {}
  const player = new Audio();
  let playToken = 0;
  const playSeq = (files, done) => {
    const t = ++playToken; let i = 0;
    const next = () => {
      if (t !== playToken) return;
      if (i >= files.length) { if (done) done(); return; }
      player.src = 'voice/' + files[i++]; player.onended = () => setTimeout(next, 150);
      player.play().catch(() => {});
    };
    next();
  };
  // 說中文（可以是幾段拼起來），需要時接著說英文
  const say = (text, en) => {
    if (!settings.sound) return;
    const parts = Array.isArray(text) ? text : [text];
    if (parts.every(p => clips.zh[p])) {
      try { speechSynthesis.cancel(); } catch {}
      const files = parts.map(p => clips.zh[p]);
      if (en && clips.en[en]) files.push(clips.en[en]);
      playSeq(files, en && !clips.en[en] ? () => say_tts('', en) : null);
      return;
    }

      <div class="row"><span>說話聲音</span><button class="pill${settings.voice === 'sister' ? ' on' : ''}" data-k="voice" data-v="sister">輕柔姐姐</button><button class="pill${settings.voice === 'girl' ? ' on' : ''}" data-k="voice" data-v="girl">小女孩</button><button class="pill" id="pTry">試聽</button></div>
      <div class="row"><span>台灣語音</span>${zhVoices.length ? zhVoices.map(v => `<button class="pill${voice && v.name === voice.name ? ' on' : ''}" data-vn="${v.name}">${v.name}</button>`).join('') : '<span style="min-width:0">這台裝置找不到台灣中文語音</span>'}</div>
      <p class="hint" style="text-align:left;font-size:15px">想要更自然的台灣口音：到 iPad「設定 › 輔助使用 › 朗讀內容 › 聲音 › 中文（台灣）」下載「美佳（加強版）」，回來重新整理就會自動使用。</p>
      <div class="row"><span>聲音</span><button class="pill${settings.sound ? ' on' : ''}" data-k="sound" data-v="1">開</button><button class="pill${!settings.sound ? ' on' : ''}" data-k="sound" data-v="0">關</button></div>
      <div class="row"><button class="act" id="pNew">重新開始計時</button><button class="act plain" id="pRest">現在休息</button><button class="act plain" id="pClose">關閉</button></div>
      <p class="hint" style="text-align:left;font-size:15px">提示：搭配 iPad 的「引導使用模式」可把小孩鎖在這個畫面。</p></div>`;
    sheet.hidden = false;
    $('pTry').addEventListener('click', () => { unlockAudio(); say('你好，我們一起幫兔子找家吧', 'Rabbit'); });
    sheet.querySelectorAll('.pill[data-vn]').forEach(p => p.addEventListener('click', () => {
      settings.voiceName = p.dataset.vn; saveSettings(); pickVoice(); unlockAudio(); say('你好，我是這個聲音'); openPanel();
    }));
    sheet.querySelectorAll('.pill[data-k]').forEach(p => p.addEventListener('click', () => {
      const k = p.dataset.k; let v = k === 'voice' ? p.dataset.v : +p.dataset.v;
      if (k === 'night' || k === 'sound') v = !!v;
      settings[k] = v; if (k === 'level') settings.streak = 0; if (k.startsWith('lv')) settings['st' + k.slice(2)] = 0;
      saveSettings(); applyNight(); openPanel();
    }));
    $('pNew').addEventListener('click', () => { close(); unlockAudio(); session = null; saveSession(); showSetup(); });
    $('pRest').addEventListener('click', () => { close(); if (!session) session = { end: Date.now(), warned: true, restEnd: null }; session.end = Date.now(); enterRest(true); });
    $('pClose').addEventListener('click', close);
  };

  // ---------- 啟動 ----------
  if (inRest()) enterRest(false);
  else if (session && session.restEnd && session.restEnd <= Date.now()) { session = null; saveSession(); show('start'); }
  else show('start');
  tick();
})();
</script>
